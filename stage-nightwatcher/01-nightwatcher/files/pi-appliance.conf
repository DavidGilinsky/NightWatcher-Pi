# File:          stage-nightwatcher/01-nightwatcher/files/pi-appliance.conf
# Purpose:       Appliance drop-in for nightwatcherd. Grants the sandboxed
#                daemon the two things this image adds to it and nothing else,
#                and holds it back until the unit has provisioned itself.
# Created:       2026-07-27
# Last Modified: 2026-07-27
# Version:       0.1.0
# License:       GPL-3.0-or-later
# ---------------------------------------------------------------------------
[Unit]
# First boot generates the database password and creates the database. Starting
# before that only produces a burst of failed connection attempts. Wants, not
# Requires: if provisioning fails, the daemon should still try, and its own
# Restart=on-failure will pick it up once the database appears.
Wants=nightwatcher-firstboot.service
After=nightwatcher-firstboot.service

[Service]
# The daemon runs as a DynamicUser under ProtectSystem=strict, so it can reach
# neither the platform agent's socket nor the export spool by default. This
# group is the only thing that changes that. List settings merge, so the unit's
# own SupplementaryGroups=dialout (the USB SQM) is unaffected.
SupplementaryGroups=nightwatcher-pi
ReadWritePaths=/var/lib/nightwatcher-pi/spool
