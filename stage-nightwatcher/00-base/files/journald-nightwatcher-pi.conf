# ---------------------------------------------------------------------------
# Author:        David Gilinsky
# File:          stage-nightwatcher/00-base/files/journald-nightwatcher-pi.conf
# Purpose:       Cap the journal. A field unit runs for months on eMMC or an SD
#                card, and an uncapped journal is both a wear problem and a
#                full-disk problem. Persistent, because the first question
#                about a unit that misbehaved last week is what it logged.
# Created:       2026-07-27
# Last Modified: 2026-07-27
# Version:       0.1.0
# License:       GPL-3.0-or-later
# ---------------------------------------------------------------------------
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
RuntimeMaxUse=32M
